{% set name = "elyra-python-editor-extension" %}
{% set version = "4.2.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 1b5d6196add78e0ed4661b84e684908b240ca86072bfa855002829415ce1f428

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - hatchling
    - pip
    - python {{ python_min }}
  run:
    - elyra-server =={{ version }}
    - python >={{ python_min }}

test:
  requires:
    - pip
    - python {{ python_min }}
  commands:
    # elyra-server leaves out upstream requirements that conda-forge cannot
    # satisfy yet (see elyra-server-feedstock), so pip check tolerates exactly:
    #   - jupyterlab-magic-wand, kfp-kubernetes: not packaged on conda-forge
    #   - kfp: every conda-forge kfp 2.x pins urllib3 <2; elyra needs urllib3 >=2.5
    #   - faiss-cpu (from jupyter-ai 2.x): conda-forge's faiss-cpu lacks PyPI metadata
    - pip check 2>&1 | grep -vE "requires (jupyterlab-magic-wand|kfp|kfp-kubernetes|faiss-cpu), which is not installed" | grep -E "which is not installed|has requirement" && exit 1 || true
    # the package must install its JupyterLab extension (the 4.0.0 sdists shipped none)
    - test -f "${PREFIX}/share/jupyter/labextensions/@elyra/python-editor-extension/package.json"

about:
  home: https://github.com/elyra-ai/elyra
  summary: Elyra JupyterLab extension providing support for Python scripts. Learn more at https://elyra.readthedocs.io/en/stable/user_guide/enhanced-script-support.html
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - akchinSTC
    - lresende
